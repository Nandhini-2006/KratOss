services:

  backend:
    build: .
    container_name: kratos-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./storage:/app/storage

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: kratos-db

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
